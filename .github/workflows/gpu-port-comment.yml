# Posts/updates a PR comment summarizing GPU-port coverage progress. Split out from
# verify-linux.yml's gpu-port-report job on purpose: that job checks out and runs a PR's
# code (which may come from a fork) and so must stay read-only, while commenting needs
# write access. workflow_run always executes with the base repository's permissions and
# never checks out the triggering PR's code, so it's the safe place to do the write.

name: GPU port PR comment

on:
  workflow_run:
    workflows: ["Linux verification"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download PR comment artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gpu-port-pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update PR comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr_number.txt') || !fs.existsSync('gpu_port_comment.md')) {
              console.log('Comment artifact incomplete; nothing to post.');
              return;
            }
            const prNumber = parseInt(fs.readFileSync('pr_number.txt', 'utf8').trim(), 10);
            const body = fs.readFileSync('gpu_port_comment.md', 'utf8');
            const marker = '<!-- gpu-port-report -->';
            const fullBody = `${marker}\n${body}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: fullBody,
              });
            }
